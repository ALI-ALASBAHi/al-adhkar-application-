<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="adkhar_project">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>adkhar_project</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Preload fonts to avoid loading issues -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Configure Flutter Web to handle loading issues -->
  <script>
    window.flutterConfiguration = {
      canvasKitBaseUrl: "https://unpkg.com/canvaskit-wasm@0.33.0/bin/",
      renderer: "canvaskit"
    };
    
    // Handle font loading errors
    document.addEventListener('DOMContentLoaded', function() {
      // Add fallback font styles
      const style = document.createElement('style');
      style.textContent = `
        body {
          font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        @font-face {
          font-family: 'Roboto';
          src: local('Roboto'), local('Roboto-Regular');
          font-weight: 400;
          font-style: normal;
        }
        @font-face {
          font-family: 'Amiri';
          src: local('Amiri'), local('Amiri-Regular');
          font-weight: 400;
          font-style: normal;
        }
      `;
      document.head.appendChild(style);
    });
  </script>
</head>
<body>
  <script>
    // Error handling for Flutter Web
    window.addEventListener('error', function(e) {
      console.log('Flutter Web Error:', e.message);
      // Don't show error alerts for font/CanvasKit loading issues
      if (e.message.includes('font') || e.message.includes('canvaskit') || e.message.includes('fetch')) {
        e.preventDefault();
        return false;
      }
    });
    
    // Handle unhandled promise rejections
    window.addEventListener('unhandledrejection', function(e) {
      console.log('Flutter Web Promise Rejection:', e.reason);
      if (e.reason && (e.reason.message.includes('font') || e.reason.message.includes('canvaskit') || e.reason.message.includes('fetch'))) {
        e.preventDefault();
        return false;
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
